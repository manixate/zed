[package]
name = "mermaid_render"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/mermaid_render.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow.workspace = true
gpui.workspace = true
merman = { git = "https://github.com/Latias94/merman", rev = "54d257aa8be7ae9ab1332d1b257205b60b43dbbd", version = "0.8.0-alpha.6", default-features = false, features = [
    "layout-cytoscape",
    "svg",
] }
quick-xml.workspace = true
serde_json.workspace = true
tracing.workspace = true
ztracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
mermaid_render = { path = ".", features = ["test-support"] }
usvg.workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]
